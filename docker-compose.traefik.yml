# Optional Traefik integration shared by local and production deployments. Use
# this together with docker-compose.yml; do not use the standalone override.

services:
  app:
    networks:
      - traefik-public
    labels:
      traefik.enable: 'true'
      traefik.docker.network: traefik-public
      traefik.http.routers.measure-the-baby.rule: 'Host(`${APP_HOST:?Set APP_HOST in .env}`)'
      traefik.http.routers.measure-the-baby.entrypoints: web
      traefik.http.routers.measure-the-baby.service: measure-the-baby
      traefik.http.routers.measure-the-baby.middlewares: measure-the-baby-compress@docker,measure-the-baby-security@docker
      traefik.http.services.measure-the-baby.loadbalancer.server.port: '3000'
      traefik.http.services.measure-the-baby.loadbalancer.server.scheme: http
      traefik.http.services.measure-the-baby.loadbalancer.healthcheck.path: /healthz
      traefik.http.services.measure-the-baby.loadbalancer.healthcheck.interval: 30s
      traefik.http.services.measure-the-baby.loadbalancer.healthcheck.timeout: 3s
      traefik.http.middlewares.measure-the-baby-compress.compress: 'true'
      traefik.http.middlewares.measure-the-baby-security.headers.stsSeconds: '31536000'
      traefik.http.middlewares.measure-the-baby-security.headers.contentTypeNosniff: 'true'
      traefik.http.middlewares.measure-the-baby-security.headers.frameDeny: 'true'
      traefik.http.middlewares.measure-the-baby-security.headers.referrerPolicy: no-referrer

networks:
  traefik-public:
    external: true
