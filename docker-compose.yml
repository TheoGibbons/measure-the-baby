# Proxy-agnostic application core. Docker Compose automatically adds
# docker-compose.override.yml for standalone use. Traefik deployments explicitly
# combine this file with docker-compose.traefik.yml instead.

name: measure-the-baby

services:
  app:
    build: .
    container_name: measure-the-baby
    restart: unless-stopped
    expose:
      - '3000'
    environment:
      DATABASE_PATH: /data/growth.sqlite
      PORT: 3000
      SESSION_DAYS: 1826
      COOKIE_SECURE: 'false'
    volumes:
      - growth_data:/data

volumes:
  growth_data:
